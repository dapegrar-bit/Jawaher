          description: Validation rejected
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Duplicate/conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - companyName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                companyName:
