openapi: 3.1.0
info:
  title: JAWAHER MIZAN - Prototype API
  version: 1.1.0
  description: واجهات نظام تجريبي وتشغيل وحدة إعداد ZATCA (محاكاة فقط، ليست ربطًا إنتاجيًا أو امتثالًا نهائيًا).
servers:
- url: http://localhost:4000
tags:
- name: Health
- name: Auth
- name: Accounting
- name: Sales and Purchases
- name: Integrations
- name: Reports
- name: Compliance
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: jawaher_session
  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
    ContactInput:
      type: object
      required:
      - name
      - kind
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - customer
          - supplier
          - both
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        taxNumber:
          type:
          - string
          - 'null'
    CatalogInput:
      type: object
      required:
      - name
      - kind
      - price
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - service
          - product
        price:
          type: string
          example: '125.00'
        unit:
          type: string
        sku:
          type: string
    DocInput:
      type: object
      required:
      - contactId
      - issueDate
      - dueDate
      - idempotencyKey
      - lines
      properties:
        contactId:
          type: string
          format: uuid
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        reference:
          type: string
        idempotencyKey:
          type: string
        lines:
          type: array
          items:
            type: object
            required:
            - description
            - quantity
            - unitPrice
            - taxRate
            properties:
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitPrice:
                type: string
              taxRate:
                type: integer
                enum:
                - 0
                - 15
    PaymentInput:
      type: object
      required:
      - paidOn
      - amount
      - idempotencyKey
      properties:
        paidOn:
          type: string
          format: date
        amount:
          type: string
          example: '1150.00'
        idempotencyKey:
          type: string
    ImportInput:
      type: object
      required:
      - provider
      - externalId
      - recordType
      - payload
      properties:
        provider:
          type: string
          enum:
          - wafeq
          - xero
          - erpnext
          - odoo
          - smacc
          - csv
          - other
        externalId:
          type: string
        recordType:
          type: string
          enum:
          - invoice
          - bill
          - contact
          - account
          - journal
        payload:
          type: object
          additionalProperties: true
paths:
  /health:
    get:
      tags:
      - Health
      summary: Database health
      responses:
        '200':
          description: Success
        '201':
          description: Resource created
        '400':
          description: Validation rejected
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Duplicate/conflict
  /auth/register:
