
services:
  - type: keyvalue
    name: jawaher-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: jawaher-api
    plan: free
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      - key: COOKIE_SECURE
        value: 'true'
      - key: PG_POOL_SIZE
        value: '5'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jawaher-redis
          property: connectionString
      - key: ZATCA_SIM_ENABLED
        value: 'false'

  - type: web
    name: jawaher-web
    plan: free
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: HOSTNAME
        value: '0.0.0.0'
    healthCheckPath: /
